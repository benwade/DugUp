name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Window system and tkinter
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-tk xvfb
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ".[meaning]" pillow pytest
      - name: Test
        run: xvfb-run -a python -m pytest -q -p no:cacheprovider

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e ".[meaning]" pillow pytest
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
