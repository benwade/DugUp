name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Window system and tkinter
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-tk xvfb
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          # every dependency as a ready-made wheel: a package that would need a compiler fails here, not on a laptop
          python -m pip install -q tomli
          python -c "import tomli; p = tomli.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(p['dependencies'] + p['optional-dependencies']['meaning'] + p['optional-dependencies']['tray']))" > deps.txt
          python -m pip install -q --only-binary=":all:" -r deps.txt pytest
          python -m pip install -q --no-deps -e .
      - name: Test
        run: xvfb-run -a python -m pytest -q -p no:cacheprovider

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          # every dependency as a ready-made wheel: a package that would need a compiler fails here, not on a laptop
          python -m pip install -q tomli
          python -c "import tomli; p = tomli.load(open('pyproject.toml', 'rb'))['project']; print('\n'.join(p['dependencies'] + p['optional-dependencies']['meaning'] + p['optional-dependencies']['tray']))" > deps.txt
          python -m pip install -q --only-binary=":all:" -r deps.txt pytest
          python -m pip install -q --no-deps -e .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
