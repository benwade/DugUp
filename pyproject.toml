[project]
name = "dugup"
version = "0.2.8"
description = "DugUp: local file search for Windows and Linux"
license = {file = "LICENSE"}
authors = [{name = "Ben Wade"}]
requires-python = ">=3.10"
dependencies = ["platformdirs", "pypdfium2>=4.30", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
ocr = ["rapidocr", "onnxruntime", "pillow"]
meaning = ["onnxruntime", "numpy", "tokenizers"]
tray = ["pystray", "pillow"]
assistant = ["mcp>=2.3,<3"]

[project.scripts]
dugup = "dugup.cli:main"

[project.gui-scripts]
dugup-window = "dugup.window:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dugup = ["dugup.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not gpu and not private'"
markers = [
    "unit: fast tests with fakes (the default)",
    "real_tool: needs a real external tool (Tesseract, RapidOCR, LibreOffice, ...); skipped when absent",
    "windows_only: only meaningful on Windows",
    "linux_only: only meaningful on Linux (or other POSIX)",
    "slow: takes more than a few seconds; run on purpose",
    "gpu: needs the GPU",
    "private: reads real folders named in the environment; prints numbers and ids only",
]
